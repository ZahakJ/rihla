# Installs rihla as a non-root user on each distro in a fresh container (test/run.sh),
# from an offline bundle with the network off, and natively on macOS; draws the tmux bar
# on each distribution's own tmux (1.8 to 3.4).
#
# Containers are started with `docker run` from the runner, not with the `container:`
# key: CentOS 7's glibc cannot run the node-based actions that `container:` jobs need.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # weekly: upstream images and download URLs keep moving
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (POSIX sh, warnings and errors)
        run: shellcheck -s sh -S warning install.sh bin/rihla test/*.sh tmux/bin/* shell/bin/* nvim/tests/run.sh
      - name: shellcheck the bash shell layer (shell/zsh.rc is zsh, which shellcheck cannot read)
        run: shellcheck -s bash -S warning shell/bash.rc

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [centos7, centos7-pkgs, rocky8, rocky9, ubuntu22, ubuntu24, debian12, fedora, fedora-py, arch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /tmp/rihla-test-cache
          key: dl-${{ hashFiles('lib/manifest', 'nvim/lazy-lock.json') }}
          restore-keys: dl-
      - name: install and assert in ${{ matrix.distro }}
        run: sh test/run.sh ${{ matrix.distro }}
        env:
          RIHLA_TEST_CACHE: /tmp/rihla-test-cache
      - name: logs
        if: always()
        run: cat /tmp/rihla-test-logs/*.log

  # The tmux bar (test/bar.sh) on the tmux each distribution ships, 1.8 to 3.4; the distro
  # rows above run it on rihla's own tmux 3.6b.
  tmux-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tmux: [tmux-1.8, tmux-2.7, tmux-3.0, tmux-3.1, tmux-3.2, tmux-3.3, tmux-3.4]
    steps:
      - uses: actions/checkout@v4
      - name: the bar on ${{ matrix.tmux }}
        run: sh test/run.sh ${{ matrix.tmux }}
      - name: logs
        if: always()
        run: cat /tmp/rihla-test-logs/*.log

  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /tmp/rihla-test-cache
          key: dl-${{ hashFiles('lib/manifest', 'nvim/lazy-lock.json') }}
          restore-keys: dl-
      - name: build a bundle for linux x86_64 (glibc 2.17+)
        run: |
          export HOME=$(mktemp -d) RIHLA_CACHE=/tmp/rihla-test-cache
          sh bin/rihla bundle -o /tmp/rihla-bundle.tar.gz
      - name: install from the bundle in CentOS 7 and Ubuntu 24.04 with --network none
        run: sh test/run.sh --offline /tmp/rihla-bundle.tar.gz centos7 ubuntu24
      - name: logs
        if: always()
        run: cat /tmp/rihla-test-logs/*.log

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: system tmux (rihla has no prebuilt tmux for macOS)
        run: brew install tmux
      - name: install and assert with a throwaway HOME
        run: sh test/run.sh local
