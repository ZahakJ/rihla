# tmux 3.2+ part of the rihla config (sourced from tmux.conf, after modern.conf).

# True colour and clipboard, the 3.2 way (terminal-overrides above still covers older tmux).
set -as terminal-features ",*256col*:RGB,xterm-kitty:RGB,alacritty:RGB,wezterm:RGB,foot*:RGB,xterm-ghostty:RGB"
set -as terminal-features ",*:clipboard"
# Clickable links (OSC 8: ls --hyperlink, delta, gcc errors) pass through on tmux 3.4+.
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 3.4' 'set -as terminal-features ",xterm-kitty:hyperlinks,xterm-ghostty:hyperlinks,wezterm:hyperlinks,foot*:hyperlinks,alacritty:hyperlinks"'

# ---------------------------------------------------------------- long directories
# A long directory keeps its last 28 characters (cutting a nested format needs 3.2).
set -g @rihla_seg_dir "#{?#{E:@rihla_fit_dir},#[fg=#{@rihla_blue}]#{@rihla_icon_dir}#[fg=#{@rihla_subtext}]#{=/-28/...:#{s|^#{HOME}|~|:pane_current_path}}#{E:@rihla_gap},}"

# ---------------------------------------------------------------- git before the key hint
# Below 90 columns git (inside a repository) takes the place of the key hint, and it shows
# from 70 columns. Not before 3.2: tmux 3.0 expands these deeper-nested formats to nothing.
set -g @rihla_git_on "#{?#{E:@rihla_w70},#{?#{m:*vim,#{pane_current_command}},0,#{?#{==:#{pane_current_command},vi},0,#{?#{E:@rihla_git_job},1,0}}},0}"
set -g @rihla_seg_git "#{?#{E:@rihla_git_on},#{E:@rihla_git_job}#{E:@rihla_gap},}"
set -g @rihla_fit_keys "#{?#{E:@rihla_w90},1,#{?#{E:@rihla_host_on},0,#{?#{E:@rihla_git_on},0,1}}}"

# ---------------------------------------------------------------- 3.2 styles
# Search matches in copy mode look like Neovim's: blue, the current one mauve.
set -gF copy-mode-match-style "bg=#{@rihla_blue},fg=#{@rihla_base}"
set -gF copy-mode-current-match-style "bg=#{@rihla_mauve},fg=#{@rihla_base}"
set -gF copy-mode-mark-style "bg=#{@rihla_surface1},fg=#{@rihla_peach}"
# The active pane's border takes the mode colour too: peach after the prefix, blue in copy mode.
set -g pane-active-border-style "fg=#{E:@rihla_mode_c}"
set -g pane-border-lines single
# The title line over each pane, only when the window has more than one.
set -g pane-border-status off

# ---------------------------------------------------------------- popups and the menu
# prefix + H: cheat sheet in a popup.
bind H display-popup -E -w 90% -h 90% "sh '$RIHLA_TMUX/bin/cheat'"
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 3.3' {
  set -gF popup-style "bg=#{@rihla_base},fg=#{@rihla_text}"
  set -gF popup-border-style "fg=#{@rihla_mauve}"
  set -g popup-border-lines rounded
}

# prefix + h: a menu of the common actions. tmux shows each entry's key on the right, in
# brackets: the key you press after the prefix, and the key that picks it in the menu, so
# using the menu teaches the bindings. 20 rows: it must fit a terminal 22 lines high.
bind h display-menu -T "#[align=centre fg=#{@rihla_mauve} bold] tmux #[nobold fg=#{@rihla_overlay}]prefix is Ctrl-Space or Ctrl-b " -x C -y C \
  " Split left | right" "|" "split-window -h -c '#{pane_current_path}'" \
  " Split top / bottom" "-" "split-window -v -c '#{pane_current_path}'" \
  " Zoom pane (toggle)" z "resize-pane -Z" \
  " Close pane" x "confirm-before -p 'kill pane? (y/n)' kill-pane" \
  "-#[fg=#{@rihla_overlay}] Move: Ctrl-h j k l (no prefix)" "" "" \
  "" \
  " New window" c new-window \
  " Next window (p: previous)" n next-window \
  " Rename window" "," "command-prompt -I '#W' 'rename-window -- \"%%\"'" \
  " Pick window or session" w "choose-tree -Zw" \
  "" \
  " Scroll / copy mode" "[" copy-mode \
  " Paste" "]" paste-buffer \
  " Detach (keeps running)" d detach-client \
  "" \
  " Cheat sheet" H "display-popup -E -w 90% -h 90% \"sh '$RIHLA_TMUX/bin/cheat'\"" \
  " All keys" "?" "list-keys -N" \
  " Reload config" r "source-file ~/.tmux.conf ; display-message 'config reloaded'" \
  "" \
  "-#[fg=#{@rihla_overlay}] (key): press it after the prefix. Esc closes" "" ""

# Menus in the palette (options added in 3.4).
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 3.4' {
  # On the terminal's own background, like the border: a background of its own would end
  # half a cell short of the border line (or stick out half a cell past it).
  set -gF menu-style "bg=default,fg=#{@rihla_text}"
  set -gF menu-selected-style "bg=#{@rihla_mauve},fg=#{@rihla_crust},bold"
  set -gF menu-border-style "fg=#{@rihla_mauve},bg=default"
  set -g menu-border-lines rounded
}

# ---------------------------------------------------------------- the command prompt
# tmux 3.7 draws a prompt or message only as wide as its text, over the bar, and leaves the
# rest of the bar standing ("(repeat) 2ork"). Here the line is cleared and the prompt gets
# the bar's mode tile: SEARCH (yellow) while you type a search, COPY (blue) for other
# prompts in copy mode, the command colour (peach) for prefix + : and messages.
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 3.7' {
  set -g @rihla_msg_c "#{?#{m:(search*,#{message})},#{E:@rihla_mode_search},#{?#{==:#{pane_mode},copy-mode},#{E:@rihla_mode_visual},#{E:@rihla_mode_command}}}"
  set -g @rihla_msg_w "#{?#{m:(search*,#{message})},SEARCH,#{?#{==:#{pane_mode},copy-mode},COPY,#{@rihla_icon_idle}}}"
  set -g message-format "#[fill=terminal fg=#{E:@rihla_msg_c} bg=terminal]#{@rihla_cap_l}#[fg=#{@rihla_crust} bg=#{E:@rihla_msg_c} bold] #{E:@rihla_msg_w} #[fg=#{E:@rihla_msg_c} bg=#{@rihla_surface0} nobold]#{@rihla_join_r}#[#{?#{command_prompt},#{E:message-command-style},#{E:message-style}}] #{message}"
}

# Searching in copy mode redraws the bar at once, so SEARCH shows up without waiting for
# the next status-interval (command-prompt -T is 3.3+).
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 3.3' {
  bind -T copy-mode-vi / command-prompt -T search -p "(search down)" { send-keys -X search-forward "%%" ; refresh-client -S }
  bind -T copy-mode-vi ? command-prompt -T search -p "(search up)" { send-keys -X search-backward "%%" ; refresh-client -S }
}
