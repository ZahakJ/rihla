# rihla tmux config.
#
# Loaded from the ~/.tmux.conf that `rihla install` writes, which sets RIHLA_TMUX to this
# directory first. Your own settings go in ~/.config/rihla/tmux/local.conf (loaded last).
#
# One file for tmux 1.8 through 3.x: plain settings here work everywhere; anything newer
# is switched on by `if-shell "$RIHLA_TMUX/bin/tmux-ver" X.Y`, and the 3.0+ / 3.2+ parts
# live in modern.conf and tmux-3.2.conf. Old tmux gets fewer features, never errors.

# ---------------------------------------------------------------- prefix
# Ctrl-Space is easy to reach and unused by shells and nvim. Ctrl-b stays a prefix too,
# so the default from every tmux tutorial keeps working.
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix
bind C-b send-prefix -2

# ---------------------------------------------------------------- basics
# Windows and panes count from 1: the number keys then match the keyboard layout.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# Esc must reach nvim at once; the default 500 ms makes leaving insert mode feel laggy.
set -sg escape-time 10
set -g history-limit 50000
set -g display-time 2000
set -g status-interval 5
set -g status-position top
set -g set-titles on
setw -g aggressive-resize on
# vi keys in copy mode, like nvim.
setw -g mode-keys vi
# A window is named after the program in it, also while you scroll (tmux's default says
# [tmux] in copy mode; the bar's COPY tile already says so).
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 1.9' "setw -g automatic-rename-format '#{?pane_dead,[dead],#{pane_current_command}}'"

# tmux-256color gives italics and correct key handling; older systems lack its terminfo.
if-shell 'for d in "$HOME/.terminfo" /etc/terminfo /lib/terminfo /usr/share/terminfo /usr/lib/terminfo; do [ -e "$d/t/tmux-256color" ] || [ -e "$d/74/tmux-256color" ] && exit 0; done; exit 1' 'set -g default-terminal tmux-256color' 'set -g default-terminal screen-256color'

bind r source-file ~/.tmux.conf \; display-message "config reloaded"

# ---------------------------------------------------------------- splits
# | and - split and keep the current directory. The defaults " and % still work.
bind | split-window -h
bind - split-window -v
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 1.9' "bind | split-window -h -c '#{pane_current_path}'"
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 1.9' "bind - split-window -v -c '#{pane_current_path}'"

# ---------------------------------------------------------------- nvim <-> tmux
# Ctrl-h/j/k/l move between tmux panes, and between nvim splits when the pane runs nvim
# (vim-tmux-navigator on the nvim side passes the move back at the edge of nvim).
# Without ps (minimal containers) fall back to the pane's foreground command, which tmux
# knows itself; that misses an nvim started by another program (git commit), nothing more.
is_vim="if command -v ps >/dev/null 2>&1; then ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'; else echo '#{pane_current_command}' | grep -iqE '^g?(view|l?n?vim?x?|fzf)(diff)?$'; fi"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
# Ctrl-l is taken by the above, so prefix + Ctrl-l clears the screen.
bind C-l send-keys C-l

# ---------------------------------------------------------------- help
# prefix + H shows the cheat sheet (a popup on tmux 3.2+, a window before that).
# prefix + h opens a menu of common actions on 3.2+ (see tmux-3.2.conf).
# prefix + ? is tmux's own list of every key.
bind H new-window -n cheat 'sh "$RIHLA_TMUX/bin/cheat"'
bind h new-window -n cheat 'sh "$RIHLA_TMUX/bin/cheat"'

# ---------------------------------------------------------------- tmux 1.9 .. 2.x
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 1.9' 'set -g focus-events on'
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 2.1' 'set -g mouse on'
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 2.2' 'set -ga terminal-overrides ",*256col*:Tc,xterm-kitty:Tc,alacritty:Tc,wezterm:Tc,foot*:Tc,xterm-ghostty:Tc"'
# Copy mode: v starts a selection, y copies it (old key-table syntax before 2.4).
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 1.8 2.4' 'bind -t vi-copy v begin-selection'
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 1.8 2.4' 'bind -t vi-copy y copy-selection'
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 2.4 3.0' 'bind -T copy-mode-vi v send -X begin-selection'
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 2.4 3.0' 'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "sh \"$RIHLA_TMUX/bin/copy\""'
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 2.4 3.0' 'bind -T copy-mode-vi C-h select-pane -L'
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 2.4 3.0' 'bind -T copy-mode-vi C-j select-pane -D'
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 2.4 3.0' 'bind -T copy-mode-vi C-k select-pane -U'
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 2.4 3.0' 'bind -T copy-mode-vi C-l select-pane -R'

# A plain bar for tmux before 3.0, in 256 colours close to the palette (tmux 3.0+ draws
# rihla's own bar from tmux/palette.conf, see modern.conf): the session, the mode word
# (2.0+), the window tabs, the time.
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 1.8 2.9' 'set -g status-bg colour235'
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 1.8 2.9' 'set -g status-fg colour145'
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 1.8 2.9' 'setw -g window-status-current-fg colour235'
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 1.8 2.9' 'setw -g window-status-current-bg colour111'
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 2.9 3.0' 'set -g status-style "bg=colour235,fg=colour145"'
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 2.9 3.0' 'setw -g window-status-current-style "bg=colour111,fg=colour235"'
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 1.8 3.0' 'set -g status-left-length 40'
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 1.8 3.0' 'set -g status-left "#[fg=colour235,bg=colour183] #S #[default] "'
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 2.0 3.0' 'set -g status-left "#[fg=colour235,bg=colour183] #S #[default]#{?client_prefix,#[fg=colour235#,bg=colour216] PREFIX #[default],}#{?pane_in_mode,#[fg=colour235#,bg=colour111] COPY #[default],}#{?window_zoomed_flag,#[fg=colour235#,bg=colour116] ZOOM #[default],} "'
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 1.8 3.0' 'setw -g window-status-format " #I #W "'
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 1.8 3.0' 'setw -g window-status-current-format " #I #W "'
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 1.8 3.0' 'set -g status-right "#[fg=colour235,bg=colour183] %H:%M "'
# Pane titles (2.6 to 2.9; modern.conf has its own): with two or more panes in a window,
# a line over each pane names its number and the program in it (none while one is zoomed).
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 2.6 3.0' 'set -g pane-border-format " #P #{pane_current_command} "'
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 2.6 3.0' "set-hook -g window-layout-changed \"set -wF pane-border-status '#{?window_zoomed_flag,off,#{?#{==:#{window_panes},1},off,top}}'\""

# ---------------------------------------------------------------- tmux 3.0+
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 3.0' 'source-file "$RIHLA_TMUX/modern.conf"'
if-shell '"$RIHLA_TMUX/bin/tmux-ver" 3.2' 'source-file "$RIHLA_TMUX/tmux-3.2.conf"'
