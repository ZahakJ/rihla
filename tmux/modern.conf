# tmux 3.0+ part of the rihla config (sourced from tmux.conf). Colours come from
# tmux/palette.conf, shared with Neovim; theme plugins rename their options between versions.

# ---------------------------------------------------------------- shell and terminal
# A pane runs bash (or sh, ksh, fish) the way a terminal window does: interactive, not as
# a login shell. tmux's default (a login shell) makes bash skip ~/.bashrc when no
# ~/.bash_profile sources it (your prompt, aliases and rihla's PATH line gone) and re-runs
# ~/.profile-style files (PATH entries twice). zsh keeps tmux's default: it reads .zshrc
# as a login shell too, and the `zsh -c` tmux would put in front of it re-reads ~/.zshenv,
# which some setups (HyDE) do not expect twice. macOS terminals open login shells, so
# there tmux keeps its default for every shell. A default-command in local.conf wins.
if-shell 'case "$SHELL" in */zsh) exit 1 ;; esac; [ "$(uname -s)" != Darwin ]' "set -g default-command 'exec \"\$SHELL\"'"
# Programs in panes may draw 24-bit colour: tmux passes it on, or turns it into the
# nearest of 256 colours when the terminal outside has fewer. Over SSH COLORTERM rarely
# arrives, so tools that look for it (bat, delta, starship's own checks) get it here.
set-environment -g COLORTERM truecolor
# The terminal's window title is the pane's title, which your shell sets (user@host:dir,
# then the running command), so it reads the same as outside tmux.
set -g set-titles-string "#{pane_title}"

# ---------------------------------------------------------------- copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "sh '$RIHLA_TMUX/bin/copy'"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "sh '$RIHLA_TMUX/bin/copy'"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# OSC 52: copying in tmux (and in nvim inside tmux) reaches the clipboard of the terminal
# you are typing in, also over SSH, with no clipboard tool on the remote machine.
set -s set-clipboard on

# Undercurl and coloured underlines for nvim diagnostics.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'


# ---------------------------------------------------------------- the look
# Everything below draws from tmux/palette.conf (the same file Neovim's status line reads),
# by name: #{@rihla_mauve}. Style options get the colour at load time (set -F); the status
# formats look it up each time they are drawn.
#
# The bar, left to right:
#   [mode | session]  1 zsh  [2 nvim]  3 logs        keys  git  dir  host  battery  [date | time]
# The two end tiles take the colour of the mode, exactly like the editor's status line:
# mauve normally, peach after the prefix key (PREFIX), blue in copy mode (COPY), yellow
# once a search is on screen (SEARCH, tmux 3.2+), teal while a pane is zoomed (ZOOM).
# Narrow terminals drop the date first, then the directory, the battery and git.
source-file "$RIHLA_TMUX/palette.conf"

# Glyphs. ascii: square tiles and plain words, nothing a font can lack. nerd: rounded tile
# ends and icons from a Nerd Font. Written as \u escapes so this file reads in any font.
set -g @rihla_cap_l ""
set -g @rihla_cap_r ""
set -g @rihla_join_r ""
set -g @rihla_join_l ""
set -g @rihla_icon_idle "tmux"
set -g @rihla_icon_dir ""
set -g @rihla_icon_host "ssh "
set -g @rihla_icon_zoom " Z"
set -g @rihla_icon_activity " #"
set -g @rihla_icon_bell " !"
set -g @rihla_gap "   "
set -g @rihla_kpad " "
if-shell '[ "$(sh "$RIHLA_TMUX/bin/icons")" = nerd ]' {
  set -g @rihla_cap_l "\ue0b6"
  set -g @rihla_cap_r "\ue0b4"
  set -g @rihla_join_r "\ue0b4"
  set -g @rihla_join_l "\ue0b6"
  set -g @rihla_icon_idle "\uf489"
  set -g @rihla_icon_dir "\U000f024b "
  set -g @rihla_icon_host "\U000f048b "
  set -g @rihla_icon_zoom " \U000f004c"
  set -g @rihla_icon_activity " \u25cf"
  set -g @rihla_icon_bell " \U000f009e"
  set -g @rihla_kpad ""
}
set -g @rihla_icons ascii
if-shell '[ "$(sh "$RIHLA_TMUX/bin/icons")" = nerd ]' 'set -g @rihla_icons nerd'

# The mode, as a colour and a word. Later tests win: PREFIX over COPY over ZOOM.
set -g @rihla_mode_c "#{?client_prefix,#{E:@rihla_mode_command},#{?#{==:#{pane_mode},copy-mode},#{?search_present,#{E:@rihla_mode_search},#{E:@rihla_mode_visual}},#{?window_zoomed_flag,#{E:@rihla_mode_zoom},#{E:@rihla_mode_normal}}}}"
set -g @rihla_mode_w "#{?client_prefix,PREFIX,#{?#{==:#{pane_mode},copy-mode},#{?search_present,SEARCH,COPY},#{?window_zoomed_flag,ZOOM,#{@rihla_icon_idle}}}}"

# Which right-hand segments fit, by the terminal's width: the date from 150 columns, the
# directory from 130, the detach hint from 115, the battery from 100, git from 90 (from
# 70 on tmux 3.2+, see tmux-3.2.conf). Long window names are cut shorter below 110. At 80
# columns: mode, session, window tabs, the key hint (git instead, inside a repository, on
# 3.2+), the time. (Widths are matched as digit patterns, which every tmux 3.x can do;
# numeric comparisons in formats only came with 3.2.)
set -g @rihla_w70 "#{?#{m:[7-9][0-9],#{client_width}},1,#{m:[1-9][0-9][0-9]*,#{client_width}}}"
set -g @rihla_w90 "#{?#{m:9[0-9],#{client_width}},1,#{m:[1-9][0-9][0-9]*,#{client_width}}}"
set -g @rihla_w100 "#{m:[1-9][0-9][0-9]*,#{client_width}}"
set -g @rihla_w110 "#{?#{m:1[1-9][0-9],#{client_width}},1,#{m:[2-9][0-9][0-9]*,#{client_width}}}"
set -g @rihla_w115 "#{?#{m:11[5-9],#{client_width}},1,#{?#{m:1[2-9][0-9],#{client_width}},1,#{m:[2-9][0-9][0-9]*,#{client_width}}}}"
set -g @rihla_w130 "#{?#{m:1[3-9][0-9],#{client_width}},1,#{m:[2-9][0-9][0-9]*,#{client_width}}}"
set -g @rihla_w150 "#{?#{m:1[5-9][0-9],#{client_width}},1,#{m:[2-9][0-9][0-9]*,#{client_width}}}"
set -g @rihla_fit_date "#{E:@rihla_w150}"
set -g @rihla_fit_dir "#{E:@rihla_w130}"
set -g @rihla_fit_detach "#{E:@rihla_w115}"
set -g @rihla_fit_battery "#{E:@rihla_w100}"
set -g @rihla_fit_git "#{E:@rihla_w90}"
# Below 90 columns the host (over SSH) takes the place of the key hint.
set -g @rihla_fit_keys "#{?#{E:@rihla_w90},1,#{?#{E:@rihla_host_on},0,1}}"
# The host is shown when you are connected over SSH (on your own machine you know where
# you are). @rihla_host_show always/never and @rihla_host (default #h) in local.conf.
set -g @rihla_host_show ssh
set -g @rihla_host "#h"
set -g @rihla_host_on "#{?#{==:#{@rihla_host_show},always},1,#{?#{==:#{@rihla_host_show},never},0,#{?SSH_CONNECTION,1,0}}}"
# The two keys a newcomer needs. Hide them: set -g @rihla_hints off (in local.conf).
set -g @rihla_hints on

# ---------------------------------------------------------------- colours
# The bar has no background of its own: its tiles sit on the terminal's, as do Neovim's.
set -gF status-style "bg=default,fg=#{@rihla_subtext}"
set -gF message-style "bg=#{@rihla_surface0},fg=#{@rihla_text}"
set -gF message-command-style "bg=#{@rihla_surface0},fg=#{@rihla_mauve}"
# Copy mode: the selection looks like a Visual selection in Neovim.
set -gF mode-style "bg=#{@rihla_surface1},fg=#{@rihla_text},bold"
set -gF pane-border-style "fg=#{@rihla_surface1}"
set -gF pane-active-border-style "fg=#{@rihla_mauve}"
set -gF display-panes-active-colour "#{@rihla_mauve}"
set -gF display-panes-colour "#{@rihla_overlay}"
setw -gF clock-mode-colour "#{@rihla_mauve}"
setw -g clock-mode-style 24
setw -gF window-status-activity-style "fg=#{@rihla_peach},bg=default"
setw -gF window-status-bell-style "fg=#{@rihla_red},bg=default"

# ---------------------------------------------------------------- status bar
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 120

# [mode | session]: the mode tile, joined to the session name like Neovim's mode and branch.
set -g status-left "#[fg=#{E:@rihla_mode_c} bg=default]#{@rihla_cap_l}#[fg=#{@rihla_crust} bg=#{E:@rihla_mode_c} bold] #{E:@rihla_mode_w} #[fg=#{E:@rihla_mode_c} bg=#{@rihla_surface0} nobold]#{@rihla_join_r}#[fg=#{E:@rihla_mode_c} bg=#{@rihla_surface0}] #{=16:session_name} #[fg=#{@rihla_surface0} bg=default]#{@rihla_cap_r} "

# Window tabs: number and name; the current one is a tile (number on blue, name raised).
# Flags: zoomed, activity, bell.
set -g @rihla_wflags "#{?window_zoomed_flag,#[fg=#{@rihla_teal}]#{@rihla_icon_zoom},}#{?window_activity_flag,#[fg=#{@rihla_peach}]#{@rihla_icon_activity},}#{?window_bell_flag,#[fg=#{@rihla_red}]#{@rihla_icon_bell},}"
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#{@rihla_overlay} bg=default] #I #[fg=#{@rihla_subtext}]#{?#{E:@rihla_w110},#{=20:window_name},#{=12:window_name}}#{E:@rihla_wflags} "
setw -g window-status-current-format "#[fg=#{@rihla_blue} bg=default]#{@rihla_cap_l}#[fg=#{@rihla_crust} bg=#{@rihla_blue} bold] #I #[fg=#{@rihla_blue} bg=#{@rihla_surface0}]#{@rihla_join_r}#[fg=#{@rihla_text} bg=#{@rihla_surface0}] #{?#{E:@rihla_w110},#{=20:window_name},#{=12:window_name}}#{E:@rihla_wflags} #[fg=#{@rihla_surface0} bg=default nobold]#{@rihla_cap_r}"

# Right-hand segments, each followed by the gap; an empty one leaves no gap behind.
# A key drawn as a key cap: a small raised tile (rounded with a Nerd Font).
set -g @rihla_kcap_l "#[fg=#{@rihla_surface0} bg=default]#{@rihla_cap_l}#[fg=#{@rihla_text} bg=#{@rihla_surface0} bold]#{@rihla_kpad}"
set -g @rihla_kcap_r "#{@rihla_kpad}#[fg=#{@rihla_surface0} bg=default nobold]#{@rihla_cap_r}#[fg=#{@rihla_overlay}]"
set -g @rihla_seg_keys "#{?#{==:#{@rihla_hints},off},,#{?#{E:@rihla_fit_keys},#[fg=#{@rihla_overlay}]Ctrl-Space #{E:@rihla_kcap_l}h#{E:@rihla_kcap_r} menu#{?#{E:@rihla_fit_detach},  #{E:@rihla_kcap_l}d#{E:@rihla_kcap_r} detach,}#{E:@rihla_gap},}}"
# git: nothing outside a repository, and nothing while the pane runs (n)vim, whose own
# status line shows the branch of the file.
set -g @rihla_git_job "#(sh \"$RIHLA_TMUX/bin/git-status\" #{q:pane_current_path} #{@rihla_icons} '#{@rihla_peach}' '#{@rihla_subtext}' '#{@rihla_green}' '#{@rihla_yellow}' '#{@rihla_overlay}')"
set -g @rihla_seg_git "#{?#{E:@rihla_fit_git},#{?#{m:*vim,#{pane_current_command}},,#{?#{==:#{pane_current_command},vi},,#{?#{E:@rihla_git_job},#{E:@rihla_git_job}#{E:@rihla_gap},}}},}"
set -g @rihla_seg_dir "#{?#{E:@rihla_fit_dir},#[fg=#{@rihla_blue}]#{@rihla_icon_dir}#[fg=#{@rihla_subtext}]#{s|^#{HOME}|~|:pane_current_path}#{E:@rihla_gap},}"
set -g @rihla_seg_host "#{?#{E:@rihla_host_on},#[fg=#{@rihla_green}]#{@rihla_icon_host}#[fg=#{@rihla_text}]#{E:@rihla_host}#{E:@rihla_gap},}"
set -g @rihla_bat_job "#(sh \"$RIHLA_TMUX/bin/battery\" #{@rihla_icons} '#{@rihla_subtext}' '#{@rihla_red}' '#{@rihla_green}')"
set -g @rihla_seg_battery "#{?#{E:@rihla_fit_battery},#{?#{E:@rihla_bat_job},#{E:@rihla_bat_job}#{E:@rihla_gap},},}"
# [date | time]: the closing tile, in the mode's colour like Neovim's cursor position.
set -g @rihla_seg_clock "#{?#{E:@rihla_fit_date},#[fg=#{@rihla_surface0} bg=default]#{@rihla_cap_l}#[fg=#{E:@rihla_mode_c} bg=#{@rihla_surface0}] %a %d %b #[fg=#{E:@rihla_mode_c} bg=#{@rihla_surface0}]#{@rihla_join_l},#[fg=#{E:@rihla_mode_c} bg=default]#{@rihla_cap_l}}#[fg=#{@rihla_crust} bg=#{E:@rihla_mode_c} bold] %H:%M #[fg=#{E:@rihla_mode_c} bg=default nobold]#{@rihla_cap_r}"
set -g status-right "#[fg=#{@rihla_subtext} bg=default]#{E:@rihla_seg_keys}#{?pane_synchronized,#[fg=#{@rihla_red} bold]SYNC#[nobold]#{E:@rihla_gap},}#{E:@rihla_seg_git}#{E:@rihla_seg_dir}#{E:@rihla_seg_host}#{E:@rihla_seg_battery}#{T:@rihla_seg_clock}"

# ---------------------------------------------------------------- pane titles
# With more than one pane in a window, each pane's top border names it: its number and
# what runs in it; the active pane's in the mode colour. One pane, or a zoomed one: no
# title line.
set -g pane-border-format "#{?pane_active,#[fg=#{@rihla_crust} bg=#{E:@rihla_mode_c} bold] #P #[fg=#{E:@rihla_mode_c} bg=default nobold] #{pane_current_command} ,#[fg=#{@rihla_overlay} bg=default] #P #{pane_current_command} }"
set-hook -g window-layout-changed "set -wF pane-border-status '#{?window_zoomed_flag,off,#{?#{==:#{window_panes},1},off,top}}'"
