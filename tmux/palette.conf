# The rihla palette: Catppuccin Mocha, mauve as the accent. The one place rihla's colours
# are written down. tmux reads this file (tmux 3.0+, from modern.conf), and so does Neovim
# (nvim/lua/rihla/palette.lua parses these lines), so the bar at the top of the terminal
# and the status line at the bottom of the editor draw from the same values.
# test/palette.sh checks that the shell prompt themes and tools/art.py use these values too.
# Every line here has the form: set -g @rihla_<name> "<#rrggbb or #{@rihla_<name>}>".

set -g @rihla_base "#1e1e2e"
set -g @rihla_mantle "#181825"
set -g @rihla_crust "#11111b"
set -g @rihla_surface0 "#313244"
set -g @rihla_surface1 "#45475a"
set -g @rihla_surface2 "#585b70"
set -g @rihla_overlay "#6c7086"
set -g @rihla_subtext "#a6adc8"
set -g @rihla_text "#cdd6f4"
set -g @rihla_mauve "#cba6f7"
set -g @rihla_blue "#89b4fa"
set -g @rihla_red "#f38ba8"
set -g @rihla_green "#a6e3a1"
set -g @rihla_yellow "#f9e2af"
set -g @rihla_peach "#fab387"
set -g @rihla_teal "#94e2d5"
set -g @rihla_pink "#f5c2e7"
set -g @rihla_rosewater "#f5e0dc"

# Modes. The left tile of both bars takes the colour of the mode you are in. Neovim's
# modes and tmux's share the meaning: normal is where you start, visual/copy selects
# text, command waits for the next key or command (tmux: after the prefix).
set -g @rihla_mode_normal "#{@rihla_mauve}"
set -g @rihla_mode_insert "#{@rihla_green}"
set -g @rihla_mode_visual "#{@rihla_blue}"
set -g @rihla_mode_replace "#{@rihla_red}"
set -g @rihla_mode_command "#{@rihla_peach}"
set -g @rihla_mode_terminal "#{@rihla_teal}"
set -g @rihla_mode_search "#{@rihla_yellow}"
set -g @rihla_mode_zoom "#{@rihla_teal}"
